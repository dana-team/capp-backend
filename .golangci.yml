version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - depguard
    - dupl
    - dupword
    - errcheck
    - errorlint
    - forcetypeassert
    - goconst
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - intrange
    - misspell
    - nakedret
    - nestif
    - noctx
    - staticcheck
    - prealloc
    - revive
    - testifylint
    - unconvert
    - unparam
    - unused
    - usetesting
    - whitespace
  settings:
    depguard:
      rules:
        # cappctl, capp-mcp and the shared DTOs must stay free of the server's
        # Kubernetes/Gin dependency tree; importing a handler package for its
        # types made both clients compile ~1,300 packages instead of ~250.
        light-clients:
          files:
            - "**/internal/cli/**"
            - "**/internal/mcpserver/**"
            - "**/cmd/cappctl/**"
            - "**/cmd/mcp/**"
            - "**/pkg/api/**"
          deny:
            - pkg: "k8s.io/client-go"
              desc: use the REST API DTOs in pkg/api instead
            - pkg: "sigs.k8s.io/controller-runtime"
              desc: use the REST API DTOs in pkg/api instead
            - pkg: "github.com/gin-gonic/gin"
              desc: clients must not depend on the server framework
            - pkg: "github.com/dana-team/container-app-operator"
              desc: use the REST API DTOs in pkg/api instead
            - pkg: "github.com/dana-team/capp-backend/internal/resources"
              desc: import the DTOs from pkg/api/<resource>
            - pkg: "github.com/dana-team/capp-backend/internal/cluster"
              desc: import ClusterMeta from pkg/api/clusters
    goconst:
      # "status" is a JSON key, a metric label and a log field — unrelated
      # uses that a shared constant would wrongly couple.
      ignore-string-values:
        - '^status$'
    revive:
      rules:
        - name: comment-spacings
  exclusions:
    generated: lax
    rules:
      - linters:
          - staticcheck
        path: test/e2e/*
      - linters:
          - dupl
        path: internal/*
      - linters:
            - dupl
        path: test/*
      - linters:
          - noctx
        path: _test\.go$
      - linters:
          - goconst
        path: _test\.go$
      - linters:
          - noctx
        path: internal/testutil/
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$