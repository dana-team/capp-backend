        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          description: Cluster is unhealthy, or backend-policy observations required by this operation are unavailable (INTERNAL_ERROR with details.reason POLICY_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/clusters/{cluster}/namespaces/{namespace}/secrets:
    get:
      tags: [secrets]
      summary: List Secrets in a namespace
      description: |
        Returns only Secrets labeled `dana.io/capp-managed=true`.
        Secrets not created through this API are not visible.
      parameters:
        - $ref: '#/components/parameters/clusterParam'
        - $ref: '#/components/parameters/namespaceParam'
      responses:
        "200":
          description: Secret list.
          content:
            application/json:
