                $ref: '#/components/schemas/SecretList'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          description: Cluster is unhealthy, or backend-policy observations required by this operation are unavailable (INTERNAL_ERROR with details.reason POLICY_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [secrets]
