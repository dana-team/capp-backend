        - $ref: '#/components/parameters/namespaceParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretRequest'
      responses:
        "503":
          $ref: '#/components/responses/PolicyUnavailable'
        "201":
          description: Secret created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretResponse'
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'

  /api/v1/clusters/{cluster}/namespaces/{namespace}/secrets/names:
    get:
      tags: [secrets]
      summary: List Secret names in a namespace
      description: |
        Returns only the names of capp-managed Secrets in the namespace.
        Useful for populating dropdowns without exposing secret data.
      parameters:
        - $ref: '#/components/parameters/clusterParam'
        - $ref: '#/components/parameters/namespaceParam'
      responses:
        "200":
          description: Secret names list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretNameListResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          description: Cluster is unhealthy, or backend-policy observations required by this operation are unavailable (INTERNAL_ERROR with details.reason POLICY_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/clusters/{cluster}/namespaces/{namespace}/secrets/{name}:
    get:
      tags: [secrets]
      summary: Get a Secret
      description: |
        Returns a single Secret. Returns 404 if the secret exists in Kubernetes
        but was not created through this API (i.e. lacks the managed label).
      parameters:
        - $ref: '#/components/parameters/clusterParam'
        - $ref: '#/components/parameters/namespaceParam'
        - $ref: '#/components/parameters/objectNameParam'
      responses:
        "503":
          $ref: '#/components/responses/PolicyUnavailable'
        "200":
          description: Secret details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

    put:
      tags: [secrets]
      summary: Update a Secret
      description: |
        Replaces the Secret's data. The backend fetches the current object first
        to preserve metadata and satisfy Kubernetes optimistic concurrency control.
        Returns 404 if the secret lacks the managed label.
        Every Capp that references the Secret and has reloadOnBoundResourceChange
        enabled is restarted once per Secret resourceVersion: the backend records
        the version in the capp.dana.io/bound-resource-versions annotation,
        which makes the operator roll out a new revision. Each change restarts
        the Capps; repeating a PUT with the same data restarts only Capps that
        have not been restarted for the current version, so retrying after a
        500 is safe.
      parameters:
        - $ref: '#/components/parameters/clusterParam'
        - $ref: '#/components/parameters/namespaceParam'
        - $ref: '#/components/parameters/objectNameParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretUpdateRequest'
      responses:
        "503":
          $ref: '#/components/responses/PolicyUnavailable'
        "200":
          description: Secret updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretResponse'
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          description: The Secret was updated, but restarting one or more bound Capps failed. Retry the same PUT to restart the remaining Capps.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [secrets]
      summary: Delete a Secret
      description: |
        Deletes a Secret. Returns 404 if the secret lacks the managed label.
      parameters:
        - $ref: '#/components/parameters/clusterParam'
        - $ref: '#/components/parameters/namespaceParam'
        - $ref: '#/components/parameters/objectNameParam'
      responses:
        "503":
          $ref: '#/components/responses/PolicyUnavailable'
        "204":
          description: Secret deleted.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          description: The Secret is still referenced by one or more Capps; the message lists them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/clusters/{cluster}/namespaces/{namespace}/secrets/{name}/bound:
    get:
      tags: [secrets]
      summary: List Capps bound to a Secret
      description: |
        Returns the Capps in the namespace that reference the Secret, and the
        subset that restart when it is updated. Returns 404 if the Secret
        lacks the managed label.
      parameters:
        - $ref: '#/components/parameters/clusterParam'
        - $ref: '#/components/parameters/namespaceParam'
        - $ref: '#/components/parameters/objectNameParam'
      responses:
        "200":
          description: Bound Capps.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoundCappsResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  # ── Capps ──────────────────────────────────────────────────────────────────────
  /api/v1/clusters/{cluster}/capps:
    get:
      tags: [capps]
      summary: List all Capps across all namespaces
      description: |
        Returns Capps from every namespace the authenticated user can access.
        Useful for cluster-wide dashboards.
      parameters:
        - $ref: '#/components/parameters/clusterParam'
      responses:
        "200":
          description: Capp list (all namespaces).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CappList'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          description: Cluster is unhealthy, or backend-policy observations required by this operation are unavailable (INTERNAL_ERROR with details.reason POLICY_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/clusters/{cluster}/namespaces/{namespace}/capps:
    get:
      tags: [capps]
      summary: List Capps in a namespace
      parameters:
        - $ref: '#/components/parameters/clusterParam'
        - $ref: '#/components/parameters/namespaceParam'
      responses:
        "200":
          description: Capp list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CappList'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          description: Cluster is unhealthy, or backend-policy observations required by this operation are unavailable (INTERNAL_ERROR with details.reason POLICY_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [capps]
      summary: Create a Capp
      parameters:
        - $ref: '#/components/parameters/clusterParam'
        - $ref: '#/components/parameters/namespaceParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CappRequest'
      responses:
        "503":
          $ref: '#/components/responses/PolicyUnavailable'
        "201":
          description: Capp created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CappResponse'
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'

  /api/v1/clusters/{cluster}/namespaces/{namespace}/capps/{name}:
    get:
      tags: [capps]
      summary: Get a Capp
      parameters:
        - $ref: '#/components/parameters/clusterParam'
        - $ref: '#/components/parameters/namespaceParam'
        - $ref: '#/components/parameters/objectNameParam'
      responses:
        "503":
          $ref: '#/components/responses/PolicyUnavailable'
        "200":
          description: Capp details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CappResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

    put:
      tags: [capps]
      summary: Update a Capp
      description: |
        Replaces the Capp spec. The backend fetches the current `resourceVersion`
        before applying the update to satisfy Kubernetes optimistic concurrency control.

        If Git sync is enabled, the new values are committed to the GitOps repository after the update.
      parameters:
        - $ref: '#/components/parameters/clusterParam'
        - $ref: '#/components/parameters/namespaceParam'
        - $ref: '#/components/parameters/objectNameParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CappRequest'
      responses:
        "503":
          $ref: '#/components/responses/PolicyUnavailable'
        "200":
          description: Capp updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CappResponse'
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [capps]
      summary: Delete a Capp
      description: |
        If Git sync is enabled, the Capp's values file is also deleted from the GitOps repository.

        The Capp is removed from the cluster first. If the backup cleanup then fails the
        delete still succeeds, answering `200` with a `warnings` entry instead of `204`.
      parameters:
        - $ref: '#/components/parameters/clusterParam'
        - $ref: '#/components/parameters/namespaceParam'
        - $ref: '#/components/parameters/objectNameParam'
      responses:
        "503":
          $ref: '#/components/responses/PolicyUnavailable'
        "204":
          description: Capp deleted, and its backup cleaned up if Git sync was enabled.
        "200":
          description: Capp deleted, but its Git backup was not cleaned up. The values file is stale.
          content:
            application/json:
              schema:
                type: object
                properties:
                  warnings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Warning'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/clusters/{cluster}/namespaces/{namespace}/capps/{name}/benchmark:
    post:
      tags: [benchmarks]
      summary: Run a benchmark for a Capp
      description: |
        Backend-policy mode denies this operation with 403 POLICY_DENIED,
        without resource or Prometheus calls. The behavior below applies to Kubernetes mode.

        Creates one benchmark Job for the Capp. The Job runs the selected
        check from the configured runner image and writes samples to every
        configured VictoriaMetrics URL.

        Returns 409 when a benchmark for this Capp is still running. A finished
        Job is deleted and replaced. Registered only when
        `resources.benchmarks.enabled` is true.
      parameters:
        - $ref: '#/components/parameters/clusterParam'
        - $ref: '#/components/parameters/namespaceParam'
        - $ref: '#/components/parameters/objectNameParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BenchmarkTriggerRequest'
      responses:
        "201":
          description: Benchmark Job created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkTriggerResponse'
        "400":
          description: Missing or unknown benchmark type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          description: A benchmark for this Capp is still running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          $ref: '#/components/responses/InternalError'

    get:
      tags: [benchmarks]
      summary: Get the benchmark status for a Capp
      description: |
        Backend-policy mode denies this operation with 403 POLICY_DENIED,
        without resource or Prometheus calls. The behavior below applies to Kubernetes mode.

        Returns the benchmark Job name and status (`running`, `completed`, or
        `failed`). Both fields are empty when no Job exists. Registered only
        when `resources.benchmarks.enabled` is true.
      parameters:
        - $ref: '#/components/parameters/clusterParam'
        - $ref: '#/components/parameters/namespaceParam'
        - $ref: '#/components/parameters/objectNameParam'
      responses:
        "200":
          description: Benchmark status. Both fields are empty when no Job exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkStatusResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/clusters/{cluster}/namespaces/{namespace}/capps/{name}/metrics/dashboards:
    get:
      tags: [metrics]
      summary: List preset PromQL dashboards for a Capp
      description: |
        Backend-policy mode denies this operation with 403 POLICY_DENIED,
        without resource or Prometheus calls. The behavior below applies to Kubernetes mode.

        Returns the latency, throughput, and autoscaling charts for this Capp.
        Each expression is scoped to the Capp's Knative service
        and is meant for `query_range`. The Capp must exist. Registered only
        when `resources.benchmarks.enabled` is true.
      parameters:
        - $ref: '#/components/parameters/clusterParam'
        - $ref: '#/components/parameters/namespaceParam'
        - $ref: '#/components/parameters/objectNameParam'
      responses:
        "200":
          description: Preset dashboards for the Capp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardsResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/clusters/{cluster}/namespaces/{namespace}/capps/{name}/metrics/query:
    get:
      tags: [metrics]
      summary: Run an instant PromQL query for a Capp
      description: |
        Backend-policy mode denies this operation with 403 POLICY_DENIED,
        without resource or Prometheus calls. The behavior below applies to Kubernetes mode.

        Forwards the query to the configured Prometheus-compatible URL
        (`resources.benchmarks.queryURL`) and returns that response unchanged.
        Keeps any query parameters on that URL, such as an API key.
        The Capp must exist. Registered only when
        `resources.benchmarks.enabled` is true.
      parameters:
        - $ref: '#/components/parameters/clusterParam'
        - $ref: '#/components/parameters/namespaceParam'
        - $ref: '#/components/parameters/objectNameParam'
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: PromQL expression.
          example: up
        - name: time
          in: query
          required: false
          schema:
            type: string
          description: Evaluation timestamp. Unix seconds or RFC3339. Defaults to now on the Prometheus server.
          example: "1700000000"
      responses:
        "200":
          description: Prometheus-compatible instant query response, passed through.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrometheusResponse'
        "400":
          description: Missing query, or the Prometheus server rejected the expression.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/PrometheusResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "502":
          description: The Prometheus server could not be reached, or it returned a server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/clusters/{cluster}/namespaces/{namespace}/capps/{name}/metrics/query_range:
    get:
      tags: [metrics]
      summary: Run a range PromQL query for a Capp
      description: |
        Backend-policy mode denies this operation with 403 POLICY_DENIED,
        without resource or Prometheus calls. The behavior below applies to Kubernetes mode.

        Forwards the query to the configured Prometheus-compatible URL
        (`resources.benchmarks.queryURL`) and returns that response unchanged.
        Keeps any query parameters on that URL, such as an API key.
        The Capp must exist. Registered only when
        `resources.benchmarks.enabled` is true.
      parameters:
        - $ref: '#/components/parameters/clusterParam'
        - $ref: '#/components/parameters/namespaceParam'
        - $ref: '#/components/parameters/objectNameParam'
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: PromQL expression.
          example: up
        - name: start
          in: query
          required: true
          schema:
            type: string
          description: Range start. Unix seconds or RFC3339.
          example: "1700000000"
        - name: end
          in: query
          required: true
          schema:
            type: string
          description: Range end. Unix seconds or RFC3339.
          example: "1700000300"
        - name: step
          in: query
          required: true
          schema:
            type: string
          description: Query resolution step.
          example: 15s
      responses:
        "200":
          description: Prometheus-compatible range query response, passed through.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrometheusResponse'
        "400":
          description: Missing parameters, or the Prometheus server rejected the expression.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/PrometheusResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "502":
          description: The Prometheus server could not be reached, or it returned a server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/clusters/{cluster}/namespaces/{namespace}/capps/{name}/sync:
    post:
      tags: [capps]
      summary: Enable Git sync for a Capp
      description: |
        Pushes the Capp's values file to the GitOps repository and adds the
        `rcs.dana.io/backup-to-git=true` label. Safe to call again to re-sync.

        Returns `501 Not Implemented` when `gitops.enabled` is false.
      parameters:
        - $ref: '#/components/parameters/clusterParam'
        - $ref: '#/components/parameters/namespaceParam'
        - $ref: '#/components/parameters/objectNameParam'
      responses:
        "200":
          description: Git sync enabled and values pushed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "501":
          description: GitOps integration is not enabled on this backend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          $ref: '#/components/responses/InternalError'
        "502":
          $ref: '#/components/responses/GitopsFailed'
        "503":
          description: Cluster is unhealthy, or backend-policy observations required by this operation are unavailable (INTERNAL_ERROR with details.reason POLICY_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [capps]
      summary: Disable Git sync for a Capp
      description: |
        Deletes the Capp's values file from the GitOps repository and removes the
        `rcs.dana.io/backup-to-git` label. No-op if Git sync is already disabled.

        Returns `501 Not Implemented` when `gitops.enabled` is false.
      parameters:
        - $ref: '#/components/parameters/clusterParam'
        - $ref: '#/components/parameters/namespaceParam'
        - $ref: '#/components/parameters/objectNameParam'
      responses:
        "200":
          description: Git sync disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "501":
          description: GitOps integration is not enabled on this backend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          $ref: '#/components/responses/InternalError'
        "502":
          $ref: '#/components/responses/GitopsFailed'
        "503":
          description: Cluster is unhealthy, or backend-policy observations required by this operation are unavailable (INTERNAL_ERROR with details.reason POLICY_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/clusters/{cluster}/namespaces/{namespace}/capps/{name}/revisions:
    get:
      tags: [capps]
      summary: List a Capp's revisions
      description: |
        Lists the CappRevisions the operator recorded for the Capp (label
        `rcs.dana.io/cappName`), newest first. Retention is governed by the
        CappConfig `revisionHistoryLimit`.
      parameters:
        - $ref: '#/components/parameters/clusterParam'
        - $ref: '#/components/parameters/namespaceParam'
        - $ref: '#/components/parameters/objectNameParam'
      responses:
        "200":
          description: Revisions of the Capp, newest first. Empty when none exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CappRevisionListResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          description: Cluster is unhealthy, or backend-policy observations required by this operation are unavailable (INTERNAL_ERROR with details.reason POLICY_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/clusters/{cluster}/namespaces/{namespace}/capps/{name}/revisions/{revision}:
    get:
      tags: [capps]
      summary: Get one revision of a Capp
      parameters:
        - $ref: '#/components/parameters/clusterParam'
        - $ref: '#/components/parameters/namespaceParam'
        - $ref: '#/components/parameters/objectNameParam'
        - $ref: '#/components/parameters/revisionParam'
      responses:
        "200":
          description: The revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CappRevisionResponse'
        "400":
          description: Revision is not a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          description: Cluster is unhealthy, or backend-policy observations required by this operation are unavailable (INTERNAL_ERROR with details.reason POLICY_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/clusters/{cluster}/namespaces/{namespace}/capps/{name}/revisions/{revision}/rollback:
    post:
      tags: [capps]
      summary: Roll a Capp back to a revision
      description: |
        Replaces the live Capp's spec, labels and annotations with those
        recorded in the revision. The `rcs.dana.io/backup-to-git` label keeps
        its current value. The operator records the result as a new revision.

        When the Capp is Git-synced, the new values are pushed to the GitOps
        repository; a push failure is reported in `warnings` and does not undo
        the rollback.
      parameters:
        - $ref: '#/components/parameters/clusterParam'
        - $ref: '#/components/parameters/namespaceParam'
        - $ref: '#/components/parameters/objectNameParam'
        - $ref: '#/components/parameters/revisionParam'
      responses:
        "200":
          description: Capp rolled back.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CappResponse'
        "400":
          description: Revision is not a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: Capp or revision not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: The Capp was modified concurrently; retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          description: Cluster is unhealthy, or backend-policy observations required by this operation are unavailable (INTERNAL_ERROR with details.reason POLICY_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/clusters/{cluster}/namespaces/{namespace}/capps/{name}/rollout:
    post:
      tags: [capps]
      summary: Promote, abort or retry a rollout
      description: |
        Submits an action for the operator to apply asynchronously by setting
        the `rcs.dana.io/rollout` annotation. Check `status.rollout` for the
        result.

        Actions that the Capp's status shows cannot apply return 409. The
        operator rejects a promote of a candidate that is not Ready only with a
        `RolloutPromoteRejected` Warning event on the Capp, which this API does
        not expose.
      parameters:
        - $ref: '#/components/parameters/clusterParam'
        - $ref: '#/components/parameters/namespaceParam'
        - $ref: '#/components/parameters/objectNameParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolloutActionRequest'
      responses:
        "202":
          description: Action submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CappResponse'
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: Capp not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: No strategy or candidate, revision is not the current candidate, an action is pending, the phase does not allow the action, or the Capp was modified concurrently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          description: Cluster is currently unhealthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/clusters/{cluster}/namespaces/{namespace}/capps/{name}/rollout/strategy:
    delete:
      tags: [capps]
      summary: Remove a Capp's rollout strategy
      description: |
        **This moves live traffic.** If a Ready candidate is rolling out and
        has not been superseded, the operator promotes it to 100%. Otherwise
        the operator pins traffic to the stable revision until a newer revision
        is Ready. A Capp with no strategy is returned unchanged.

        When the Capp is Git-synced, the new values are pushed to the GitOps
        repository; a push failure is reported in `warnings` and does not undo
        the removal.
      parameters:
        - $ref: '#/components/parameters/clusterParam'
        - $ref: '#/components/parameters/namespaceParam'
        - $ref: '#/components/parameters/objectNameParam'
      responses:
        "200":
          description: Strategy removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CappResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: Capp not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: The Capp was modified concurrently; retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          description: Cluster is currently unhealthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/clusters/{cluster}/namespaces/{namespace}/capps/{name}/migrate:
    post:
      tags: [capps]
      summary: Migrate a Capp to another cluster or namespace
      description: |
        Creates a copy of the Capp on the target cluster and namespace, including
        all managed dependent resources (Secrets and ConfigMaps labeled
        `dana.io/capp-managed=true`). Optionally deletes the source Capp after
        successful creation on the target.

        **Hostname handling:** When the source Capp has a custom hostname
        (`routeSpec.hostname`), copying without a different `targetHostname`
        is rejected to prevent duplicate DNS CNAME records. On move
        (`deleteSource=true`), `targetHostname` is optional — if omitted the
        existing hostname is preserved via a DNS bypass annotation that is
        removed after the source is deleted. If `targetHostname` is provided
        and differs from the source, the bypass annotation is skipped and the
        operator webhook validates the new hostname's global uniqueness.
        `targetHostname` must not be set when the source has no hostname.

        Same-cluster migration to a different namespace is supported. Migrating to
        the same cluster and namespace is rejected.

        Backend-policy requires eligible editor access at source and destination,
        including copy-only requests. Both cluster allowlists apply before dependent
        reads/writes; operator status alone is insufficient. Each target uses its
        configured backend credentials. Authorization does not make migration atomic.
      parameters:
        - $ref: '#/components/parameters/clusterParam'
        - $ref: '#/components/parameters/namespaceParam'
        - $ref: '#/components/parameters/objectNameParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrateRequest'
      responses:
        "200":
          description: Migration successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrateResponse'
        "400":
          description: Invalid request body or same cluster and namespace as source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: Endpoint allowlist/policy denial, Kubernetes-mode caller RBAC denial, or execution/webhook refusal. Backend-policy returns the same details.reason POLICY_DENIED for unknown destinations, insufficient roles, excluded namespaces, missing or unsynchronized destination observations, and pending destination UID association.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Source Capp not found. Kubernetes-mode destination validation also returns this for an unknown target cluster or missing target namespace; backend-policy destination authorization conceals these conditions with 403 POLICY_DENIED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: Capp, Secret, or ConfigMap already exists on the target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          description: Source policy observations or UID association are unavailable (details.reason POLICY_UNAVAILABLE), or a cluster is unhealthy (code CLUSTER_UNHEALTHY). Backend-policy checks destination health only after destination authorization succeeds; unavailable destination policy observations or association return 403 POLICY_DENIED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Observability ──────────────────────────────────────────────────────────────
  /healthz:
    get:
      tags: []
      summary: Liveness probe
      description: Returns 200 if the process is alive.
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              example: {"status": "ok"}

  /readyz:
    get:
      tags: []
      summary: Readiness probe
      description: |
        Kubernetes mode requires at least one healthy cluster. Backend-policy also
        requires that cluster's namespace and policy observations to have initially
        synchronized. Empty policies and individual pending UID associations do not
        prevent readiness. Later watch degradation retains readiness and cached state;
        this does not guarantee execution credentials/permissions or all-target readiness.
      security: []
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              example: {"status": "ready"}
        "503":
          description: No healthy target (with initial observation synchronization in backend-policy mode) is available.
          content:
            application/json:
              example: {"status": "not ready", "reason": "no healthy clusters available"}

  /metrics:
    get:
      tags: []
      summary: Prometheus metrics endpoint
      description: |
        Exposes Prometheus metrics for monitoring. Returns metrics in the Prometheus
        text-based format. The path defaults to `/metrics` but can be customized via
        `metrics.path` configuration.
      security: []
      responses:
        "200":
          description: Prometheus metrics.
          content:
            text/plain:
              example: "# HELP...\n# TYPE...\nmetric_name{label1=\"value1\"} 1.23\n"

  /docs:
    get:
      tags: []
      summary: API documentation
      description: |
        Interactive API documentation (Scalar HTML UI) for this OpenAPI spec.
        Served as embedded HTML.
      security: []
      responses:
        "200":
          description: API documentation HTML page.
          content:
            text/html:
              example: "<html>...</html>"

  /ui/scalar.js:
    get:
      tags: []
      summary: Scalar UI JavaScript library
      description: |
        The Scalar JavaScript library used by the `/docs` endpoint.
        Served as embedded JavaScript.
      security: []
      responses:
        "200":
          description: Scalar JavaScript library.
          content:
            application/javascript:
              example: "// Scalar UI library..."

  /openapi.yaml:
    get:
      tags: []
      summary: OpenAPI specification
      description: |
        Returns this OpenAPI specification document in YAML format.
        Served as embedded text.
      security: []
      responses:
        "200":
          description: OpenAPI specification (YAML).
          content:
            application/yaml:
              example: "openapi: 3.1.0\ninfo:...\n"
