# Default values for the capp-backend Helm chart.
# Override these in a separate values file or with --set on the CLI.

# ── Image ─────────────────────────────────────────────────────────────────────
image:
  repository: ghcr.io/dana-team/capp-backend
  tag: ""        # defaults to .Chart.AppVersion
  pullPolicy: Always

imagePullSecrets: []


# ── Backend configuration ─────────────────────────────────────────────────────
# These values are rendered into the ConfigMap that the server reads at startup.
# Sensitive values (tokens, secrets) go in the secret block below.
config:
  server:
    port: 8080
    readTimeoutSeconds: 30
    writeTimeoutSeconds: 30
    idleTimeoutSeconds: 60
    corsAllowedOrigins: []

  auth:
    mode: "passthrough"
    # OpenShift OAuth settings. Required when mode is "openshift".
    openshift:
      apiServer: ""        # External OpenShift API server URL
      caCert: ""           # base64-encoded PEM CA bundle (optional)
      clientId: ""         # OAuth client ID registered in OpenShift
      redirectUri: ""      # Frontend callback URL
      scopes:
        - "user:info"
        - "user:check-access"
      tokenCacheTTLSeconds: 60
    # LDAP settings. Required fields must be supplied when mode is "ldap".
    # Credentials are configured in secret.ldapBindPassword/ldapSigningPrivateKey.
    ldap:
      url: ""              # ldaps:// only; verified TLS, default port 636
      caCert: ""           # base64-encoded PEM CA bundle; empty uses system roots
      bindDN: ""           # search-account DN
      # Use OU/container bases covering required users/groups; AD domain-root
      # searches can return referrals, which cause login to fail with HTTP 503.
      userBaseDN: ""
      userFilter: ""       # must contain exactly one {username} placeholder
      usernameAttribute: "sAMAccountName"
      groupBaseDN: ""
      groupFilter: "(&(objectClass=group)(member={userDN}))" # direct membership
      groupNameAttribute: "sAMAccountName"
      timeoutSeconds: 10
      tokenTTLSeconds: 900
      issuer: ""           # shared across backend instances
      audience: ""         # shared across backend instances
      signingKeyID: ""     # lowercase letters/digits, '-' and '_' only
      verificationKeys: {} # key ID -> PEM Ed25519 public key; active key is derived
    rateLimit:
      enabled: true
      requestsPerSecond: 20
      burst: 40

  logging:
    level: "info"
    format: "json"
    addCallerInfo: false

  metrics:
    enabled: true
    path: "/metrics"

  tracing:
    enabled: false
    otlpEndpoint: ""
    serviceName: "capp-backend"
    sampleRate: 0.1

  # Cluster entries. At least one is required.
  # Tokens must be provided via the secret block, not here.
  clusters:
    - name: "default"
      displayName: "Default Cluster"
      gitOpsPath: ""      # defaults to cluster name if empty
      credential:
        inline:
          apiServer: "https://kubernetes.default.svc"
          # caCert: ""    # base64 PEM — omit for in-cluster service account
          insecure: false  # set true to skip TLS verification (NOT for production)
          token: ""       # overridden by secret.clusterTokens[0]
      allowedNamespaces: []

  resources:
    namespaces:
      enabled: true
    capps:
      enabled: true
    capprevisions:
      enabled: true
    # Per-Capp metrics charts. The query URL comes from
    # secret.observabilityQueryURL. Each metric sets either query (one line)
    # or series (up to 10 lines on one chart). Every query must contain
    # $selector in every vector selector, which the backend replaces with
    # the Capp's namespace/name matchers. Set clusterLabel on every metric
    # when more than one cluster is configured. See config/config.yaml in the
    # repository for a full example.
    observability:
      enabled: false
      labels: {}          # extra matchers on every query, e.g. {env: prod}
      metrics: []
      # metrics:
      #   - name: latency
      #     description: Request duration measured by the queue-proxy
      #     type: histogram
      #     unit: seconds
      #     namespaceLabel: k8s_namespace_name
      #     objectLabel: kn_service_name
      #     series:
      #       - legend: p50
      #         query: histogram_quantile(0.50, sum by (le) (rate(kn_serving_invocation_duration_seconds_bucket{$selector}[5m])))
      #       - legend: p95
      #         query: histogram_quantile(0.95, sum by (le) (rate(kn_serving_invocation_duration_seconds_bucket{$selector}[5m])))
    cappSizes:
      small:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
      medium:
        requests:
          cpu: "500m"
          memory: "512Mi"
        limits:
          cpu: "1000m"
          memory: "1Gi"
      large:
        requests:
          cpu: "1000m"
          memory: "1Gi"
        limits:
          cpu: "2000m"
          memory: "2Gi"

  # GitOps — push Capp values to a git repository for ArgoCD sync.
  # Disabled by default. Enable and provide credentials to activate.
  gitops:
    enabled: false
    repoURL: ""           # e.g. "https://github.com/org/capps-gitops.git"
    branch: "main"
    authMethod: "token"   # "token" or "ssh"
    sshKeyPath: "/etc/capp/ssh/id_rsa"  # path to SSH key file when authMethod is "ssh"
    insecureHostKey: false # skip SSH host key verification (required in containers without known_hosts)
    pathPrefix: "sites"   # directory prefix: <pathPrefix>/<gitOpsPath>/<ns>/<capp>.yaml
    timeoutSeconds: 20    # timeout for each git sync/delete operation

# ── Secrets ───────────────────────────────────────────────────────────────────
# These values are placed in a Kubernetes Secret and injected as environment
# variables. They MUST be overridden at install time — never leave defaults.
secret:
  # Cluster bearer tokens. Each entry corresponds to the cluster at the same
  # index in config.clusters[]. Injected as CAPP_CLUSTERS_<N>_CREDENTIAL_INLINE_TOKEN.
  clusterTokens:
    - ""

  # OpenShift OAuth client secret. Required when config.auth.mode is "openshift".
  # Override: --set secret.openshiftClientSecret="<client-secret>"
  openshiftClientSecret: ""

  # LDAP search-account password. Required when config.auth.mode is "ldap".
  # Injected as CAPP_AUTH_LDAP_BINDPASSWORD.
  ldapBindPassword: ""

  # PEM Ed25519 signing private key. Required when config.auth.mode is "ldap".
  # Injected as CAPP_AUTH_LDAP_SIGNINGPRIVATEKEY.
  # Override: --set-file secret.ldapSigningPrivateKey=/path/to/private/key
  ldapSigningPrivateKey: ""

  # GitOps token. Required when config.gitops.authMethod is "token".
  # Override: --set secret.gitopsToken="<personal-access-token>"
  gitopsToken: ""

  # Prometheus-compatible URL that metrics queries read from, including any
  # token in its query string (e.g. https://vm.example.com?apikey=abc123).
  # Required when config.resources.observability.enabled is true.
  # Injected as CAPP_RESOURCES_OBSERVABILITY_QUERYURL.
  # Override: --set secret.observabilityQueryURL="http://vm-query.monitoring.svc:8428"
  observabilityQueryURL: ""

  # SSH private key for GitOps. Required when config.gitops.authMethod is "ssh".
  # Override: --set-file secret.sshKey=/path/to/private/key
  sshKey: ""

# ── User permissions ─────────────────────────────────────────────────────────
rbac:
  # Include OpenShift Projects API permissions in the capp-user role.
  openShiftProjects: false

# ── Service Account (openshift and ldap modes) ────────────────────────────────
# Created when auth.mode is "openshift" or "ldap" and create is true.
# Both modes bind impersonation permissions to this account; only OpenShift
# receives OAuth annotations and TokenReview permissions.
# Set create to false and name to an existing account to reuse it.
serviceAccount:
  create: true
  name: "capp-backend"

# ── Capp-mode specific settings ───────────────────────────────────────────────
capp:
  # spec.scaleSpec.metric: concurrency|rps|cpu|memory (Knative/KPA via CAPP operator).
  scaleMetric: "concurrency"

  # state: enabled | disabled
  state: "enabled"

  # route configures the external hostname. Optional.
  route:
    enabled: false
    hostname: ""
    tlsEnabled: true
    routeTimeoutSeconds: 30

  # log configures Elasticsearch log shipping. Optional.
  log:
    enabled: false
    type: "elastic"
    host: ""
    target: ""
    user: ""
    passwordSecret: ""
    passwordKey: "password"

# ── Resource requests/limits ──────────────────────────────────────────────────
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

# ── Pod security ──────────────────────────────────────────────────────────────
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]

# ── Probes ────────────────────────────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /healthz
    port: http1
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /readyz
    port: http1
  initialDelaySeconds: 5
  periodSeconds: 10

# ── ServiceMonitor (Prometheus Operator) ──────────────────────────────────────
serviceMonitor:
  enabled: false
  namespace: ""
  port: "queue-proxy-metrics"
  interval: "30s"
  path: "/metrics"
  labels: {}
  scrapeTimeout: "30s"
  scheme: "http"
  tls:
    insecureSkipVerify: true
    caFile: ""

# ── Node selection ────────────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}

# ── Namespace ─────────────────────────────────────────────────────────────────
# The Kubernetes namespace to deploy into.
namespace: capp-platform-system
