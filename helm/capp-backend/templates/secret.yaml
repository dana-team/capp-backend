apiVersion: v1
kind: Secret
metadata:
  name: {{ include "capp-backend.secretName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "capp-backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $i, $token := .Values.secret.clusterTokens }}
  clusterToken-{{ $i }}: {{ $token | quote }}
  {{- end }}
  {{- if eq .Values.config.auth.mode "openshift" }}
  openshiftClientSecret: {{ required "secret.openshiftClientSecret is required when auth.mode is openshift" .Values.secret.openshiftClientSecret | quote }}
  {{- end }}
  {{- if eq .Values.config.auth.mode "ldap" }}
  ldapBindPassword: {{ required "secret.ldapBindPassword is required when auth.mode is ldap" .Values.secret.ldapBindPassword | quote }}
  ldapSigningPrivateKey: {{ required "secret.ldapSigningPrivateKey is required when auth.mode is ldap" .Values.secret.ldapSigningPrivateKey | quote }}
  {{- end }}
  {{- if and .Values.config.gitops.enabled (eq .Values.config.gitops.authMethod "token") }}
  gitopsToken: {{ .Values.secret.gitopsToken | quote }}
  {{- end }}
  {{- if and .Values.config.gitops.enabled (eq .Values.config.gitops.authMethod "ssh") }}
  id_rsa: {{ .Values.secret.sshKey | quote }}
  {{- end }}
  {{- if (dig "resources" "observability" "enabled" false .Values.config) }}
  observabilityQueryURL: {{ required "secret.observabilityQueryURL is required when observability is enabled" .Values.secret.observabilityQueryURL | quote }}
  {{- end }}
