{{- if or (eq .Values.config.auth.mode "openshift") (eq .Values.config.auth.mode "ldap") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "capp-backend.fullname" . }}-impersonator
  labels:
    {{- include "capp-backend.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["users", "groups"]
    verbs: ["impersonate"]
  {{- if eq .Values.config.auth.mode "openshift" }}
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  {{- end }}
{{- end }}
