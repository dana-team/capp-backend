{{- if ne .Values.config.authorization.mode "backend-policy" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: capp-user
  labels:
    {{- include "capp-backend.labels" . | nindent 4 }}
rules:
  - apiGroups: ["rcs.dana.io"]
    resources: ["capps", "capps/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rcs.dana.io"]
    resources: ["capprevisions", "capprevisions/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "pods", "pods/exec", "pods/log", "services", "endpoints", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  {{- if (dig "resources" "cfunc" "enabled" false .Values.config) }}
  - apiGroups: ["fission.io"]
    resources: ["environments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- if (dig "resources" "cfunc" "functions" "enabled" false .Values.config) }}
  - apiGroups: ["fission.io"]
    resources: ["functions", "packages", "httptriggers", "timetriggers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["fission.io"]
    resources: ["packages/status"]
    verbs: ["patch"]
  {{- else }}
  - apiGroups: ["fission.io"]
    resources: ["functions"]
    verbs: ["list"]
  {{- end }}
  {{- end }}
  {{- if .Values.rbac.openShiftProjects }}
  - apiGroups: ["", "project.openshift.io"]
    resources: ["projects"]
    verbs: ["get", "list", "watch"]
  {{- end }}
{{- end }}
