apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "capp-backend.configMapName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "capp-backend.labels" . | nindent 4 }}
    dana.io/capp-managed: "true"
data:
  config.yaml: |
    server:
      port: {{ .Values.config.server.port }}
      readTimeoutSeconds: {{ .Values.config.server.readTimeoutSeconds }}
      writeTimeoutSeconds: {{ .Values.config.server.writeTimeoutSeconds }}
      idleTimeoutSeconds: {{ .Values.config.server.idleTimeoutSeconds }}
      corsAllowedOrigins:
        {{- toYaml .Values.config.server.corsAllowedOrigins | nindent 8 }}

    authorization:
      mode: {{ .Values.config.authorization.mode | quote }}
      restrictedBindingNamePrefixes: {{ toJson .Values.config.authorization.restrictedBindingNamePrefixes }}

    auth:
      mode: {{ .Values.config.auth.mode | quote }}
      {{- if eq .Values.config.auth.mode "openshift" }}
      openshift:
        apiServer: {{ .Values.config.auth.openshift.apiServer | quote }}
        {{- if .Values.config.auth.openshift.caCert }}
        caCert: {{ .Values.config.auth.openshift.caCert | quote }}
        {{- end }}
        clientId: {{ .Values.config.auth.openshift.clientId | quote }}
        clientSecret: ""
        redirectUri: {{ .Values.config.auth.openshift.redirectUri | quote }}
        scopes:
          {{- toYaml .Values.config.auth.openshift.scopes | nindent 10 }}
        tokenCacheTTLSeconds: {{ .Values.config.auth.openshift.tokenCacheTTLSeconds }}
      {{- end }}
      {{- if eq .Values.config.auth.mode "ldap" }}
      ldap:
        url: {{ .Values.config.auth.ldap.url | quote }}
        caCert: {{ .Values.config.auth.ldap.caCert | quote }}
        bindDN: {{ .Values.config.auth.ldap.bindDN | quote }}
        userBaseDN: {{ .Values.config.auth.ldap.userBaseDN | quote }}
        userFilter: {{ .Values.config.auth.ldap.userFilter | quote }}
        usernameAttribute: {{ .Values.config.auth.ldap.usernameAttribute | quote }}
        groupBaseDN: {{ .Values.config.auth.ldap.groupBaseDN | quote }}
        groupFilter: {{ .Values.config.auth.ldap.groupFilter | quote }}
        groupNameAttribute: {{ .Values.config.auth.ldap.groupNameAttribute | quote }}
        timeoutSeconds: {{ .Values.config.auth.ldap.timeoutSeconds }}
        tokenTTLSeconds: {{ .Values.config.auth.ldap.tokenTTLSeconds }}
        issuer: {{ .Values.config.auth.ldap.issuer | quote }}
        audience: {{ .Values.config.auth.ldap.audience | quote }}
        signingKeyID: {{ .Values.config.auth.ldap.signingKeyID | quote }}
        verificationKeys:
          {{- toYaml .Values.config.auth.ldap.verificationKeys | nindent 10 }}
      {{- end }}
      rateLimit:
        enabled: {{ .Values.config.auth.rateLimit.enabled }}
        requestsPerSecond: {{ .Values.config.auth.rateLimit.requestsPerSecond }}
        burst: {{ .Values.config.auth.rateLimit.burst }}

    logging:
      level: {{ .Values.config.logging.level | quote }}
      format: {{ .Values.config.logging.format | quote }}
      addCallerInfo: {{ .Values.config.logging.addCallerInfo }}

    metrics:
      enabled: {{ .Values.config.metrics.enabled }}
      path: {{ .Values.config.metrics.path | quote }}

    tracing:
      enabled: {{ .Values.config.tracing.enabled }}
      otlpEndpoint: {{ .Values.config.tracing.otlpEndpoint | quote }}
      serviceName: {{ .Values.config.tracing.serviceName | quote }}
      sampleRate: {{ .Values.config.tracing.sampleRate }}

    clusters:
      {{- range $i, $cluster := .Values.config.clusters }}
      - name: {{ $cluster.name | quote }}
        displayName: {{ $cluster.displayName | quote }}
        {{- if $cluster.cfuncRouterURL }}
        cfuncRouterURL: {{ $cluster.cfuncRouterURL | quote }}
        {{- end }}
        credential:
          {{- if $cluster.credential.kubeconfigPath }}
          kubeconfigPath: {{ $cluster.credential.kubeconfigPath | quote }}
          {{- else if $cluster.credential.inline }}
          inline:
            apiServer: {{ $cluster.credential.inline.apiServer | quote }}
            {{- if $cluster.credential.inline.caCert }}
            caCert: {{ $cluster.credential.inline.caCert | quote }}
            {{- end }}
            {{- if $cluster.credential.inline.insecure }}
            insecure: true
            {{- end }}
            {{- if (eq $cluster.credential.inline.apiServer "https://kubernetes.default.svc") }}
            token: {{ $cluster.credential.inline.token  | quote }}
            {{- else }}
            token: ""
            {{- end }}
          {{- end }}
        {{- with $cluster.authorization }}
        authorization:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        allowedNamespaces:
          {{- toYaml $cluster.allowedNamespaces | nindent 10 }}
      {{- end }}

    resources:
      namespaces:
        enabled: {{ .Values.config.resources.namespaces.enabled }}
      capps:
        enabled: {{ .Values.config.resources.capps.enabled }}
        maxLogStreams: {{ .Values.config.resources.capps.maxLogStreams | default 100 }}
      capprevisions:
        enabled: {{ .Values.config.resources.capprevisions.enabled }}
      {{- $obs := dig "resources" "observability" dict .Values.config }}
      {{- if $obs.enabled }}
      observability:
        enabled: true
        {{- with $obs.labels }}
        labels:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if not $obs.metrics }}
        {{- fail "config.resources.observability.metrics must list at least one metric when observability is enabled" }}
        {{- end }}
        metrics:
          {{- toYaml $obs.metrics | nindent 10 }}
      {{- end }}
      cappSizes:
        small:
          requests:
            cpu: {{ .Values.config.resources.cappSizes.small.requests.cpu | quote }}
            memory: {{ .Values.config.resources.cappSizes.small.requests.memory | quote }}
          limits:
            cpu: {{ .Values.config.resources.cappSizes.small.limits.cpu | quote }}
            memory: {{ .Values.config.resources.cappSizes.small.limits.memory | quote }}
        medium:
          requests:
            cpu: {{ .Values.config.resources.cappSizes.medium.requests.cpu | quote }}
            memory: {{ .Values.config.resources.cappSizes.medium.requests.memory | quote }}
          limits:
            cpu: {{ .Values.config.resources.cappSizes.medium.limits.cpu | quote }}
            memory: {{ .Values.config.resources.cappSizes.medium.limits.memory | quote }}
        large:
          requests:
            cpu: {{ .Values.config.resources.cappSizes.large.requests.cpu | quote }}
            memory: {{ .Values.config.resources.cappSizes.large.requests.memory | quote }}
          limits:
            cpu: {{ .Values.config.resources.cappSizes.large.limits.cpu | quote }}
            memory: {{ .Values.config.resources.cappSizes.large.limits.memory | quote }}
      {{- with .Values.config.resources.cfunc }}
      {{- if .enabled }}
      {{- if not .sizes }}
      {{- fail "config.resources.cfunc.sizes must name at least one size when cfunc is enabled" }}
      {{- end }}
      {{- if not .flavors }}
      {{- fail "config.resources.cfunc.flavors must name at least one flavor when cfunc is enabled" }}
      {{- end }}
      cfunc:
        enabled: true
        registryPrefix: {{ .registryPrefix | quote }}
        imagePullSecret: {{ .imagePullSecret | quote }}
        allowCustomBuild: {{ .allowCustomBuild | default false }}
        maxPoolSize: {{ .maxPoolSize | default 10 }}
        defaultSize: {{ required "config.resources.cfunc.defaultSize is required when cfunc is enabled" .defaultSize | quote }}
        sizes:
          {{- toYaml .sizes | nindent 10 }}
        flavors:
          {{- toYaml .flavors | nindent 10 }}
        {{- with .fetcherResources }}
        fetcherResources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .builderResources }}
        builderResources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .trustedCA }}
        {{- if .configMap }}
        trustedCA:
          configMap: {{ .configMap | quote }}
        {{- end }}
        {{- end }}
        onboardNamespaces: {{ .onboardNamespaces | default false }}
        {{- with .functions }}
        {{- if .enabled }}
        functions:
          enabled: true
          git:
            baseURL: {{ required "config.resources.cfunc.functions.git.baseURL is required when functions are enabled" (dig "git" "baseURL" "" .) | quote }}
            username: {{ dig "git" "username" "oauth2" . | quote }}
          maxTriggers: {{ .maxTriggers | default 10 }}
          maxTimeoutSeconds: {{ .maxTimeoutSeconds | default 300 }}
          defaultConcurrency: {{ .defaultConcurrency | default 500 }}
          maxConcurrency: {{ .maxConcurrency | default 500 }}
          minCronIntervalSeconds: {{ .minCronIntervalSeconds | default 60 }}
        {{- end }}
        {{- end }}
      {{- end }}
      {{- end }}

    {{- if (dig "desiredState" "enabled" false .Values.config) }}

    desiredState:
      enabled: true
      mongo:
        database: {{ dig "mongo" "database" "capp" .Values.config.desiredState | quote }}
        timeoutSeconds: {{ dig "mongo" "timeoutSeconds" 3 .Values.config.desiredState }}
      encryption:
        activeKeyID: {{ required "config.desiredState.encryption.activeKeyID is required when desiredState is enabled" (dig "encryption" "activeKeyID" "" .Values.config.desiredState) | quote }}
    {{- end }}
