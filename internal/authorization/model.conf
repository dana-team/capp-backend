# Request: identity, scope, resource, action.
[request_definition]
r = sub, dom, obj, act

# Permission: role, scope, resource, action.
[policy_definition]
p = sub, dom, obj, act

# Assign an identity to a role within a scope.
[role_definition]
g = _, _, _

# Allow when a matching permission exists; otherwise deny.
[policy_effect]
e = some(where (p.eft == allow))

# Match resource and action, require a matching scope and role.
# allNamespaces covers namespace scopes, never cluster operations.
[matchers]
m = r.obj == p.obj && r.act == p.act && (r.dom == p.dom || (p.dom == "allNamespaces" && regexMatch(r.dom, "^ns/.+$"))) && g(r.sub, p.sub, p.dom)
