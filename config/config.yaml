# capp-backend configuration
# Scalar values can be overridden by environment variables prefixed with CAPP_
# using underscores as separators, e.g.:
#   server.port          → CAPP_SERVER_PORT
#   auth.mode            → CAPP_AUTH_MODE
#   clusters[0].credential.inline.token → CAPP_CLUSTERS_0_CREDENTIAL_INLINE_TOKEN
# Supply auth.ldap.verificationKeys as a map in mounted YAML, not JSON in an env var.

# ── HTTP Server ───────────────────────────────────────────────────────────────
server:
  # TCP port the backend listens on.
  port: 8080

  # Maximum duration (seconds) for reading a complete request including body.
  readTimeoutSeconds: 30

  # Maximum duration (seconds) before timing out a response write.
  writeTimeoutSeconds: 30

  # Maximum idle connection duration (seconds) when keep-alives are enabled.
  idleTimeoutSeconds: 60

  # Origins allowed to make cross-origin requests. In production, list only
  # the frontend URLs. Use ["*"] only for local development.
  corsAllowedOrigins:
    - "http://localhost:3000"   # capp-frontend Vite dev server
    # - "https://console.example.com"

# ── Authentication ────────────────────────────────────────────────────────────
authorization:
  mode: kubernetes
  restrictedBindingNamePrefixes: ["system:"]

auth:
  # mode controls how incoming requests are authenticated. Options:
  #
  #   passthrough (recommended for initial deployment)
  #     The Authorization: Bearer <token> header from the client is forwarded
  #     directly to the Kubernetes API server. No server-side session is
  #     created. This preserves the current frontend security model and
  #     requires no key management on the backend.
  #
  #   openshift (recommended for production deployments with OpenShift OAuth)
  #     POST /api/v1/auth/login authenticates users via OpenShift OAuth.
  #     The backend impersonates users on managed clusters using per-cluster
  #     service-account tokens. Fully stateless.
  #
  #   ldap
  #     POST /api/v1/auth/login verifies directory credentials over TLS and
  #     issues an access JWT for backend authentication. No refresh, ADFS SSO,
  #     MFA, or OAuth browser flow.
  mode: "passthrough"

  # OpenShift OAuth auth mode example:
  # Authenticates users via OpenShift OAuth, impersonates them on managed clusters.
  # Requires an OAuthClient registered in OpenShift and a service account with
  # impersonate permissions on each managed cluster.
  # auth:
  #   mode: openshift
  #   openshift:
  #     apiServer: "https://api.my-cluster.example.com:6443"
  #     caCert: ""                # optional: base64-encoded PEM CA bundle
  #     clientId: "capp-backend"
  #     clientSecret: ""          # inject via CAPP_AUTH_OPENSHIFT_CLIENTSECRET
  #     redirectUri: "https://console.example.com/auth/callback"
  #     scopes: ["user:info", "user:check-access"]
  #     tokenCacheTTLSeconds: 60

  # LDAP example: set mode to ldap and uncomment ldap below (under auth).
  # Requires HTTPS for API password login and an inline service-account token
  # on every managed cluster. Users/groups impersonation permissions are required
  # only in Kubernetes authorization mode.
  # ldap:
  #   url: "ldaps://directory.example.com:636" # verified LDAPS only
  #   caCert: ""              # base64 PEM CA bundle; empty uses system roots
  #   bindDN: "CN=capp-reader,OU=Services,DC=example,DC=com"
  #   bindPassword: ""        # inject only via CAPP_AUTH_LDAP_BINDPASSWORD
  #   # Use OU/container bases covering required users/groups; AD domain-root
  #   # searches can return referrals, which cause login to fail with HTTP 503.
  #   userBaseDN: "OU=Users,DC=example,DC=com"
  #   userFilter: "(sAMAccountName={username})" # exactly one {username}
  #   usernameAttribute: "sAMAccountName"
  #   groupBaseDN: "OU=Groups,DC=example,DC=com"
  #   groupFilter: "(&(objectClass=group)(member={userDN}))" # exactly one {userDN}
  #   groupNameAttribute: "sAMAccountName"
  #   timeoutSeconds: 10      # positive total login deadline
  #   tokenTTLSeconds: 900    # positive lifetime; log in again after expiry
  #   issuer: "capp-backend"  # shared by every replica
  #   audience: "capp-api"    # shared by every replica
  #   signingKeyID: "key-2026" # lowercase letters/digits, '-' and '_' only
  #   signingPrivateKey: ""   # PEM Ed25519; CAPP_AUTH_LDAP_SIGNINGPRIVATEKEY only
  #   verificationKeys: {}    # additional key ID -> PEM Ed25519 public key
  # The active public key is derived from the private key. Distribute a new
  # public key before activating it; retain old public keys until tokens expire.
  # Match canonical User/Group names in Kubernetes RoleBindings or backend-policy
  # bindings, according to authorization mode. The default group filter
  # covers direct membership, not guaranteed nested or primary membership.
  # See README.md for HTTPS integration, key rotation, and lockout ownership.

  rateLimit:
    # Toggle per-IP, per-instance rate limiting globally. This is not per-account
    # or distributed AD lockout protection; directory operators own lockout policy.
    enabled: true

    # Sustained request rate per second (token bucket refill rate).
    requestsPerSecond: 20

    # Maximum burst above the sustained rate.
    burst: 40

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  # Minimum log level. One of: debug, info, warn, error.
  level: "debug"

  # Log encoder format. One of:
  #   json    — structured JSON (recommended for production / log aggregation)
  #   console — human-readable (recommended for local development)
  format: "console"

  # Include the file:line caller location in each log entry.
  addCallerInfo: false

# ── Prometheus Metrics ────────────────────────────────────────────────────────
metrics:
  # Toggle the Prometheus scrape endpoint.
  enabled: true

  # HTTP path at which Prometheus scrapes metrics.
  path: "/metrics"

# ── OpenTelemetry Tracing ─────────────────────────────────────────────────────
tracing:
  # Toggle OTLP trace export. Requires otlpEndpoint to be set.
  enabled: false

  # gRPC endpoint of the OTLP collector, e.g. "localhost:4317".
  otlpEndpoint: ""

  # service.name resource attribute attached to every span.
  serviceName: "capp-backend"

  # Fraction of traces to sample, in [0.0, 1.0].
  # 1.0 = always sample (use in development), 0.1 = 10% (typical production).
  sampleRate: 0.1

# ── Clusters ──────────────────────────────────────────────────────────────────
# Each entry defines one managed Kubernetes/OpenShift cluster. The cluster's
# name appears in every API path: /api/v1/clusters/{name}/...
#
# Credential: set exactly ONE of kubeconfigPath or inline.
# OpenShift and LDAP require inline.token for every cluster; use the inline
# option and remove kubeconfigPath for those modes.
# Sensitive values (token, secretKey) must be injected via environment variables
# — never committed in this file.
clusters:
  - name: "local"
    displayName: "Local (kind)"
    credential:
      # Option A: path to a kubeconfig file (mounted from a Secret in production).
      kubeconfigPath: "/home/user/.kube/config"
      # Option B: inline credentials.
      inline:
        apiServer: "https://127.0.0.1:45883"
        # caCert: ""        # base64-encoded PEM CA. Omit to skip TLS verification.
        token: ""           # inject via CAPP_CLUSTERS_0_CREDENTIAL_INLINE_TOKEN
    # policyNamespace is required in backend-policy mode;
    # the lists are optional.
    authorization:
      policyNamespace: capp-platform-system
      protectedNamespaces: [capp-platform-system]
      operatorUsers: []
      operatorGroups: []
    # allowedNamespaces restricts which namespaces are visible through this cluster entry.
    # An empty list adds no namespace restriction; authorization checks still apply.
    allowedNamespaces: []

  # Production cluster example (comment out above and fill in below):
  # - name: "production"
  #   displayName: "Production"
  #   credential:
  #     kubeconfigPath: "/etc/capp/kubeconfigs/production.yaml"
  #   allowedNamespaces: []

# ── Resource Handlers ─────────────────────────────────────────────────────────
# Feature flags to enable/disable individual resource handlers. Disabling a
# handler removes its routes entirely — the server behaves as if those
# endpoints do not exist.
resources:
  namespaces:
    enabled: true
  capps:
    enabled: true
  capprevisions:
    enabled: true

  # cfunc (function as a service, on Fission). A client creates a pool of warm
  # pods from a flavor and a size; the images and resources behind them are set
  # here and never reach a client. GET /api/v1/cfunc/flavors and
  # /api/v1/cfunc/sizes list the names. Requires Fission on the managed clusters.
  # cfunc:
  #   enabled: false
  #   registryPrefix: "ghcr.io/fission"   # or CAPP_RESOURCES_CFUNC_REGISTRYPREFIX; joined as <prefix>/<image>
  #   imagePullSecret: ""                 # Secret name; must exist in each namespace that holds a pool
  #   allowCustomBuild: false             # true lets a request's "advanced" block name its own build image and command
  #   maxPoolSize: 10                     # highest poolSize a request may ask for
  #   defaultSize: small                  # size used when a request names none
  #   sizes:                              # size name (no dot) → resources of each warm pod
  #     small:
  #       requests: {cpu: "100m", memory: "128Mi"}
  #       limits:   {cpu: "200m", memory: "256Mi"}
  #     large:
  #       requests: {cpu: "500m", memory: "512Mi"}
  #       limits:   {cpu: "1", memory: "1Gi"}
  #   flavors:                            # flavor name (lowercase, no dot) → images, relative to registryPrefix
  #     python:
  #       image: "python-env:1.35.0"
  #       # The three build settings are the flavor's defaults. With
  #       # allowCustomBuild, a client can override buildImage and buildCommand
  #       # for one pool with the request's "advanced" block; builderEnv is
  #       # set only here.
  #       buildImage: "python-builder:1.35.0"
  #       buildCommand: ""                # empty uses "build", the script of the official build images
  #       builderEnv:                     # set on the builder container; stored in a ConfigMap, so no tokens
  #         - name: PIP_INDEX_URL
  #           value: "https://registry.example.internal/pypi/simple"
  #     java:
  #       image: "jvm-env:1.32.0"
  #       buildImage: "jvm-builder:1.32.0"
  #       keepArchive: true               # the JVM runtime loads the .jar as one file
  #   onboardNamespaces: false            # true: the first pool of a namespace sets fission.io/enabled=true on it (Fission tenancy.mode=dynamic)
  #   functions:                          # code from a git repository that runs in a pool, with http and cron triggers
  #     enabled: false
  #     git:
  #       baseURL: "https://gitlab.example.com"   # the only server code is cloned from; a function's source.url must start with it
  #       token: ""                       # inject via CAPP_RESOURCES_CFUNC_FUNCTIONS_GIT_TOKEN; needs read access to the repositories
  #       username: "oauth2"              # sent with the token; GitLab and GitHub accept any non-empty value
  #     maxTriggers: 10                   # highest number of triggers of one function
  #     maxTimeoutSeconds: 300            # highest timeoutSeconds of a function
  #     defaultConcurrency: 500           # pods one function may use at one time when a request names none (Fission's own default)
  #     maxConcurrency: 500               # highest concurrency a request may ask for
  #     minCronIntervalSeconds: 60        # shortest interval between two runs of a cron trigger
  #
  # A cluster entry can name its Fission router with cfuncRouterURL. The
  # function test route calls it, and a function response then shows the full
  # URL of each http trigger:
  #   clusters:
  #     - name: prod
  #       cfuncRouterURL: "https://fn.example.com"

  # Per-Capp metrics served at .../capps/{name}/metrics[/{metric}]. Callers
  # pick a metric by name and never send PromQL. Set either query or series
  # (at most 10) on each metric. Every query must contain
  # $selector; it is replaced with matchers for the Capp's namespace and name
  # (plus the cluster when clusterLabel is set, plus every entry in labels).
  # Queries are parsed as PromQL, and every vector selector, including a bare
  # metric name with no braces, must include $selector. clusterLabel is
  # required on every metric when more than one cluster is configured.
  # With one cluster it is optional, but only leave it out when queryURL
  # serves that cluster alone. If the Prometheus also holds other clusters, a
  # Capp with the same namespace and name there matches too, and its metrics
  # are returned to callers who can only read this one. Set clusterLabel, or
  # pin the cluster with labels. The backend logs a warning at startup for
  # every metric without clusterLabel.
  # The caller must be able to read the Capp.
  # observability:
  #   enabled: false
  #   queryURL: ""          # or CAPP_RESOURCES_OBSERVABILITY_QUERYURL; can carry a token, e.g. https://vm.example.com?apikey=abc123
  #   labels: {}            # extra matchers on every query, e.g. {env: prod}
  #   metrics:
  #     # series groups several lines on one chart; each has its own query.
  #     - name: latency
  #       description: Request duration measured by the queue-proxy
  #       type: histogram
  #       unit: seconds
  #       series:
  #         - legend: p50
  #           query: histogram_quantile(0.50, sum by (le) (rate(kn_serving_invocation_duration_seconds_bucket{$selector}[5m])))
  #         - legend: p95
  #           query: histogram_quantile(0.95, sum by (le) (rate(kn_serving_invocation_duration_seconds_bucket{$selector}[5m])))
  #       namespaceLabel: k8s_namespace_name
  #       objectLabel: kn_service_name
  #     # query is shorthand for a single line whose legend is the name.
  #     - name: throughput
  #       description: Requests per second
  #       type: counter
  #       unit: requests/s
  #       query: sum(rate(kn_serving_invocation_duration_seconds_count{$selector}[1m]))
  #       namespaceLabel: k8s_namespace_name
  #       objectLabel: kn_service_name
