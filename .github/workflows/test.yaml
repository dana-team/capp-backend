# CI: Server test workflow
# Runs on server/shared code changes. Lint, unit tests, Helm lint, Docker build check.
name: Test (server)

on:
  push:
    branches: ["main", "master"]
    paths:
      - "cmd/server/**"
      - "internal/auth/**"
      - "internal/apierrors/**"
      - "internal/cluster/**"
      - "internal/config/**"
      - "internal/gitops/**"
      - "internal/middleware/**"
      - "internal/resources/**"
      - "internal/server/**"
      - "pkg/**"
      - "api/**"
      - "helm/**"
      - "deploy/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/test.yaml"
      - ".github/actions/setup-go/**"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "cmd/server/**"
      - "internal/auth/**"
      - "internal/apierrors/**"
      - "internal/cluster/**"
      - "internal/config/**"
      - "internal/gitops/**"
      - "internal/middleware/**"
      - "internal/resources/**"
      - "internal/server/**"
      - "pkg/**"
      - "api/**"
      - "helm/**"
      - "deploy/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/test.yaml"
      - ".github/actions/setup-go/**"
  workflow_call:
    inputs:
      skip_build_checks:
        description: "Skip build and docker-build jobs (release workflow builds for real)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  # ── Go: lint + test ──────────────────────────────────────────────────────────
  go:
    name: Go lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-key: server-test

      - name: Download dependencies
        run: go mod download

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet $(go list ./... | grep -v 'internal/cli\|cmd/cappctl\|internal/mcpserver\|cmd/mcp')

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m --skip-dirs=internal/cli,internal/mcpserver

      - name: Unit tests (with race detector)
        run: |
          go test -v -race -coverprofile=coverage.out \
            $(go list ./... | grep -v 'internal/cli\|cmd/cappctl\|internal/mcpserver\|cmd/mcp')

      - name: Coverage report
        run: go tool cover -func=coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── Go + Docker: build check (no push) ──────────────────────────────────────
  # Runs in parallel with the lint/test job. The binary is compiled on the
  # runner (warm Go cache) and packaged with the Dockerfile's prebuilt stage,
  # instead of compiling from scratch inside BuildKit.
  build:
    name: Build server binary & image
    if: ${{ !inputs.skip_build_checks }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-key: server-build

      - name: Build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/server ./cmd/server/...

      - name: Build image (no push)
        run: docker build -f deploy/Dockerfile --build-arg BINARY=prebuilt -t ghcr.io/dana-team/capp-backend:ci .

  # ── Helm: lint ───────────────────────────────────────────────────────────────
  helm-lint:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.17.0

      - name: Lint chart (deployment mode)
        run: |
          helm lint helm/capp-backend \
            --set deployAs=deployment \
            --set config.clusters[0].name=test \
            --set config.clusters[0].credential.inline.apiServer=https://example.com

      - name: Lint chart (capp mode)
        run: |
          helm lint helm/capp-backend \
            --set deployAs=capp \
            --set config.clusters[0].name=test \
            --set config.clusters[0].credential.inline.apiServer=https://example.com

      - name: Template chart (deployment mode)
        run: |
          helm template capp-backend helm/capp-backend \
            --set deployAs=deployment \
            --set config.clusters[0].name=test \
            --set config.clusters[0].credential.inline.apiServer=https://example.com \
            --set secret.jwtSecretKey=test-secret \
            > /dev/null

      - name: Template chart (capp mode)
        run: |
          helm template capp-backend helm/capp-backend \
            --set deployAs=capp \
            --set config.clusters[0].name=test \
            --set config.clusters[0].credential.inline.apiServer=https://example.com \
            --set secret.jwtSecretKey=test-secret \
            > /dev/null
