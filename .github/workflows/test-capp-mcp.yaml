# CI: capp-mcp test workflow
# Runs on capp-mcp code changes. Lint, unit tests, binary build check,
# Helm lint, Docker build check. Mirrors test-cli.yaml's structure:
# capp-mcp is architecturally a second standalone client of
# capp-backend's REST API (like cappctl), so it gets its own workflow and
# release cadence rather than being bundled into test.yaml (the API server's
# own workflow).
name: Test (capp-mcp)

on:
  push:
    branches: ["main", "master"]
    paths:
      - "cmd/mcp/**"
      - "internal/mcpserver/**"
      - "internal/cli/client/**"
      - "pkg/clientversion/**"
      - "internal/resources/**"
      - "helm/capp-mcp/**"
      - "deploy/Dockerfile.capp-mcp"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/test-capp-mcp.yaml"
      - ".github/actions/setup-go/**"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "cmd/mcp/**"
      - "internal/mcpserver/**"
      - "internal/cli/client/**"
      - "pkg/clientversion/**"
      - "internal/resources/**"
      - "helm/capp-mcp/**"
      - "deploy/Dockerfile.capp-mcp"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/test-capp-mcp.yaml"
      - ".github/actions/setup-go/**"
  workflow_call:
    inputs:
      skip_build_checks:
        description: "Skip the build job (release workflow builds for real)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  # ── Go: lint + test ──────────────────────────────────────────────────────────
  go:
    name: Go lint & test (capp-mcp)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-key: mcp-test

      - name: Download dependencies
        run: go mod download

      - name: go vet
        run: go vet ./internal/mcpserver/... ./cmd/mcp/...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m ./internal/mcpserver/... ./cmd/mcp/...

      - name: Unit tests (with race detector)
        run: go test -v -race -coverprofile=coverage.out ./internal/mcpserver/... ./cmd/mcp/...

      - name: Coverage report
        run: go tool cover -func=coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── Go + Docker: build check (no push) ──────────────────────────────────────
  # Runs in parallel with the lint/test job. The binary is compiled on the
  # runner (warm Go cache) and packaged with the Dockerfile's prebuilt stage,
  # instead of compiling from scratch inside BuildKit.
  build:
    name: Build capp-mcp binary & image
    if: ${{ !inputs.skip_build_checks }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-key: mcp-build

      - name: Build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/capp-mcp ./cmd/mcp/...

      - name: Build image (no push)
        run: docker build -f deploy/Dockerfile.capp-mcp --build-arg BINARY=prebuilt -t ghcr.io/dana-team/capp-mcp:ci .

  # ── Helm: lint ───────────────────────────────────────────────────────────────
  helm-lint:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.17.0

      - name: Lint chart
        run: helm lint helm/capp-mcp

      - name: Template chart (Capp route disabled)
        run: helm template capp-mcp helm/capp-mcp > /dev/null

      - name: Template chart (Capp route enabled)
        run: |
          helm template capp-mcp helm/capp-mcp \
            --set route.enabled=true \
            --set route.hostname=mcp.example.com \
            > /dev/null
