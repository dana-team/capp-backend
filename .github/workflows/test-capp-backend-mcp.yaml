# CI: capp-backend-mcp test workflow
# Runs on capp-backend-mcp code changes. Lint, unit tests, binary build check,
# Helm lint, Docker build check. Mirrors test-cli.yaml's structure:
# capp-backend-mcp is architecturally a second standalone client of
# capp-backend's REST API (like cappctl), so it gets its own workflow and
# release cadence rather than being bundled into test.yaml (the API server's
# own workflow).
name: Test (capp-backend-mcp)

on:
  push:
    branches: ["main", "master"]
    paths:
      - "cmd/mcp/**"
      - "internal/mcpserver/**"
      - "internal/cli/client/**"
      - "internal/resources/**"
      - "helm/capp-backend-mcp/**"
      - "deploy/Dockerfile.capp-backend-mcp"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/test-capp-backend-mcp.yaml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "cmd/mcp/**"
      - "internal/mcpserver/**"
      - "internal/cli/client/**"
      - "internal/resources/**"
      - "helm/capp-backend-mcp/**"
      - "deploy/Dockerfile.capp-backend-mcp"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/test-capp-backend-mcp.yaml"
  workflow_call:
    inputs:
      skip_build_checks:
        description: "Skip build and docker-build jobs (release workflow builds for real)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ── Go: lint + test ──────────────────────────────────────────────────────────
  go:
    name: Go lint & test (capp-backend-mcp)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: go vet
        run: go vet ./internal/mcpserver/... ./cmd/mcp/...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --timeout=5m ./internal/mcpserver/... ./cmd/mcp/...

      - name: Unit tests (with race detector)
        run: go test -v -race -coverprofile=coverage.out ./internal/mcpserver/... ./cmd/mcp/...

      - name: Coverage report
        run: go tool cover -func=coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── Go: build check ──────────────────────────────────────────────────────────
  build:
    name: Build capp-backend-mcp binary
    if: ${{ !inputs.skip_build_checks }}
    runs-on: ubuntu-latest
    needs: go
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o /dev/null ./cmd/mcp/...

  # ── Helm: lint ───────────────────────────────────────────────────────────────
  helm-lint:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.17.0

      - name: Lint chart
        run: helm lint helm/capp-backend-mcp

      - name: Template chart (Capp route disabled)
        run: helm template capp-backend-mcp helm/capp-backend-mcp > /dev/null

      - name: Template chart (Capp route enabled)
        run: |
          helm template capp-backend-mcp helm/capp-backend-mcp \
            --set route.enabled=true \
            --set route.hostname=mcp.example.com \
            > /dev/null

  # ── Docker: build check (no push) ────────────────────────────────────────────
  docker-build:
    name: Docker build (no push)
    if: ${{ !inputs.skip_build_checks }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.capp-backend-mcp
          push: false
          tags: ghcr.io/dana-team/capp-backend-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
